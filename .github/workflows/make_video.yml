name: Make Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "Why is the sky blue?"
      scenes:
        description: "Number of scenes (12 is about 3 minutes)"
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install -U edge-tts pillow requests

      - name: Make the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SCENES: ${{ inputs.scenes }}
        run: python main.py

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            output/final.mp4
            output/info.txt
